apiVersion: apps/v1
kind: Deployment

metadata:
  name: bank-transfer-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bank-transfer-api

  template:
    metadata:
      labels:
        app: bank-transfer-api

    spec:
      containers:
        - name: bank-transfer-api
          image: ghcr.io/kyriakospapatheodoropoulos/bank-transfer-devsecops:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bank-transfer-secrets
                  key: database-url

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
